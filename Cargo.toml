[package]
name = "pebblehost-cli"
version = "2026.8.29+27"
edition = "2021"
description = "CLI wrapper for the PebbleHost client API"
license = "MIT"
readme = "README.md"

[[bin]]
name = "pb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync"] }
thiserror = "2"
url = "2"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }


[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[package]
name = "pebblehost-cli"
version = "2026.8.21+12"
edition = "2021"
description = "CLI wrapper for the PebbleHost client API"
license = "MIT"
readme = "README.md"

[[bin]]
name = "pb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
thiserror = "2"
url = "2"

[dev-dependencies]
wiremock = "0.6"

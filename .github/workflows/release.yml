name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

## Release steps: check if a release is needed, compute version, build matrix, upload assets, create GitHub release.

jobs:
  changed:
    name: Check if release is needed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if release should run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "Manual release requested."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
                echo "Build passed on master."
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "Build did not succeed; skipping release."
                echo "changed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            schedule)
              latest_commit_ts=$(git log -1 --format=%ct)
              latest_release_at=$(gh api "/repos/${{ github.repository }}/releases/latest" --jq '.created_at' 2>/dev/null || true)

              if [ -z "$latest_release_at" ]; then
                echo "No previous release; creating first nightly."
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              latest_release_ts=$(date -d "$latest_release_at" +%s)

              if [ "$latest_commit_ts" -gt "$latest_release_ts" ]; then
                echo "New commits since last release; creating nightly."
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "No new commits since last release; skipping nightly."
                echo "changed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Unknown event; skipping release."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

          # Idempotency guard: if a release tag already covers the current
          # HEAD (tag points at or descends from HEAD), skip. This makes
          # serialized/dropped runs harmless: the surviving run releases the
          # latest master commit, so no commit is lost or released twice.
          if [ "$(cat "$GITHUB_OUTPUT" | grep -c 'changed=true')" = "1" ]; then
            latest_tag=$(git tag --sort=-creatordate --list 'v[0-9]*' | head -1 || true)
            if [ -n "$latest_tag" ] && git merge-base --is-ancestor HEAD "$latest_tag" 2>/dev/null; then
              echo "HEAD already released as ${latest_tag}; skipping release."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  version:
    name: Compute and commit version
    needs: changed
    if: needs.changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      cargo_version: ${{ steps.version.outputs.cargo_version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute dated version
        id: version
        run: |
          date_part=$(date -u +%Y.%-m.%-d)
          run_number=${{ github.run_number }}

          release_version="${date_part}.${run_number}"
          cargo_version="${date_part}+${run_number}"
          tag="v${release_version}"

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "cargo_version=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          echo "Release version: ${release_version}"
          echo "Cargo version:   ${cargo_version}"

      - name: Update package version
        run: |
          sed -i 's/^version = .*/version = "${{ steps.version.outputs.cargo_version }}"/' Cargo.toml
          cargo update -p pebblehost-cli

      - name: Commit version bump
        id: commit
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "release: ${{ steps.version.outputs.tag }} [skip ci]" || true
          branch="${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${branch}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-latest,  cross: false }
          - { target: aarch64-unknown-linux-gnu,   os: ubuntu-latest,  cross: true }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin,         os: macos-latest,   cross: false }
          - { target: aarch64-apple-darwin,        os: macos-latest,   cross: false }
          - { target: x86_64-pc-windows-msvc,      os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package binary
        shell: bash
        run: |
          version="${{ needs.version.outputs.release_version }}"
          target="${{ matrix.target }}"
          mkdir -p dist

          if [ -f "target/${target}/release/pb.exe" ]; then
            exe="pb.exe"
          else
            exe="pb"
          fi

          cp "target/${target}/release/${exe}" "dist/${exe}"
          tar -czf "dist/pebblehost-cli-${version}-${target}.tar.gz" -C dist "${exe}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/pebblehost-cli-*

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ needs.version.outputs.tag }}"

          # Collect all packaged binaries from the matrix jobs
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find dist -name 'pebblehost-cli-*' -type f -print0)

          gh release create "${tag}" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "Release ${tag}" \
            --notes "Version ${{ needs.version.outputs.release_version }} built from GitHub Actions run ${{ github.run_number }}." \
            "${assets[@]}"
